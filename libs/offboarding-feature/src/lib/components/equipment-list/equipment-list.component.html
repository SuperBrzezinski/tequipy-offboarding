@if (items().length === 0) {
  <p class="text-center py-10 text-[var(--p-text-muted-color)]">
    No equipment assigned to this employee.
  </p>
} @else {
  <div class="flex flex-col gap-3">
    @for (returnItem of items(); track returnItem.item.id) {
      <tq-equipment-row
        [item]="returnItem"
        [isEditing]="isEditing(returnItem.item.id)"
        [editMode]="getEditMode(returnItem.item.id)"
        [suggestedNote]="noteHints()[returnItem.item.id] || null"
        [readOnly]="readOnly()"
        (beginReturn)="beginReturn.emit($event)"
        (confirmReturn)="confirmReturn.emit($event)"
        (cancelReturn)="cancelReturn.emit($event)"
        (undoReturn)="undoReturn.emit($event)"
        (beginIssue)="beginIssue.emit($event)"
        (confirmIssue)="confirmIssue.emit($event)"
        (cancelIssue)="cancelIssue.emit($event)"
        (suggestNote)="suggestNote.emit($event)"
      />
    }
  </div>
}
